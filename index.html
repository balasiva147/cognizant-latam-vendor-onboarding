<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cognizant LATAM Vendor Onboarding</title>
  <style>
    :root{--navy:#13233c;--navy2:#20375d;--blue:#2364d2;--cyan:#45d4e8;--ink:#172033;--muted:#667085;--line:#e5e9f2;--bg:#f5f7fb;--white:#fff;--green:#158a62;--red:#c83c50;--amber:#ad6a00;--shadow:0 18px 50px rgba(20,35,60,.10)}
    *{box-sizing:border-box}body{margin:0;font:15px/1.5 Inter,Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .shell{min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:250px;background:linear-gradient(180deg,var(--navy),#0c182a);color:white;padding:28px 20px;z-index:5}.brand{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:750}.brand-mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--blue));display:grid;place-items:center;font-weight:900}.brand small{display:block;color:#aebbd0;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}.nav{margin-top:42px}.nav button{width:100%;display:flex;align-items:center;gap:12px;border:0;background:transparent;color:#bbc7da;padding:12px;border-radius:10px;text-align:left;margin:5px 0}.nav button.active,.nav button:hover{background:rgba(255,255,255,.09);color:#fff}.nav .icon{width:25px;text-align:center}.side-bottom{position:absolute;bottom:24px;left:20px;right:20px}.user-mini{border-top:1px solid rgba(255,255,255,.12);padding-top:18px;display:flex;align-items:center;gap:10px}.avatar{width:34px;height:34px;border-radius:50%;background:#e9f6ff;color:var(--blue);display:grid;place-items:center;font-weight:800}.user-mini small{color:#96a6bf;display:block}.main{margin-left:250px;min-height:100vh}.top{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 38px}.top h1{font-size:18px;margin:0}.top-actions{display:flex;gap:12px;align-items:center}.pill{padding:7px 11px;border-radius:99px;background:#eaf8f5;color:#127253;font-weight:700;font-size:12px}.content{padding:34px 38px;max-width:1400px;margin:auto}.eyebrow{text-transform:uppercase;letter-spacing:.12em;color:var(--blue);font-size:11px;font-weight:800}.hero{display:flex;justify-content:space-between;gap:30px;align-items:flex-end;margin-bottom:28px}.hero h2{font-size:31px;line-height:1.2;margin:7px 0}.hero p{margin:0;color:var(--muted)}
    .card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 5px 18px rgba(25,45,75,.04)}.setup{padding:24px;display:grid;grid-template-columns:1fr 1fr auto;gap:16px;align-items:end;margin-bottom:26px}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;border:1px solid #d6dce8;border-radius:9px;padding:11px 12px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(35,100,210,.1)}.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:750}.btn.primary{background:var(--blue);color:#fff}.btn.primary:hover{background:#1855b7}.btn.secondary{background:#eef3fb;color:#27456f}.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.danger{background:#fff0f2;color:var(--red)}.btn:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.metric{padding:20px}.metric .label{color:var(--muted);font-size:12px}.metric strong{display:block;font-size:28px;margin:7px 0}.metric small{color:var(--muted)}.section-head{display:flex;justify-content:space-between;align-items:center;margin:30px 0 14px}.section-head h3{margin:0;font-size:18px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#7a8496;padding:13px 16px;border-bottom:1px solid var(--line)}.table td{padding:15px 16px;border-bottom:1px solid var(--line);vertical-align:middle}.table tr:last-child td{border-bottom:0}.ticket{font-weight:800;color:var(--blue)}.status{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:800}.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.status.pending{background:#fff7e8;color:var(--amber)}.status.review{background:#eaf1ff;color:#245fc1}.status.approved{background:#eaf8f3;color:var(--green)}.status.rejected{background:#fff0f2;color:var(--red)}
    .modal-backdrop{position:fixed;inset:0;background:rgba(7,17,31,.62);z-index:20;display:grid;place-items:center;padding:25px}.modal{background:#fff;border-radius:18px;max-width:760px;width:100%;max-height:90vh;overflow:auto;box-shadow:var(--shadow)}.modal-head{padding:23px 26px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.modal-head h3{margin:0}.close{border:0;background:none;font-size:22px;color:var(--muted)}.modal-body{padding:24px 26px}.modal-foot{padding:18px 26px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.span2{grid-column:span 2}.docs{margin-top:20px;border:1px solid var(--line);border-radius:12px;overflow:hidden}.doc-row{display:grid;grid-template-columns:34px 1fr auto;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:center}.doc-row:last-child{border-bottom:0}.doc-row p{margin:0;font-weight:700}.doc-row small{color:var(--muted)}.doc-actions{display:flex;gap:7px}.mini{border:1px solid var(--line);background:white;border-radius:7px;padding:6px 9px;font-size:12px;font-weight:700}.mini.approve{color:var(--green)}.mini.reject{color:var(--red)}
    .login{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;background:#fff}.login-art{padding:58px;background:radial-gradient(circle at 70% 20%,rgba(69,212,232,.22),transparent 24%),linear-gradient(145deg,#10213b,#193965 60%,#2460a6);color:#fff;position:relative;overflow:hidden}.login-art:after{content:"";position:absolute;width:500px;height:500px;border:1px solid rgba(255,255,255,.16);border-radius:50%;right:-140px;bottom:-220px;box-shadow:0 0 0 70px rgba(255,255,255,.03),0 0 0 150px rgba(255,255,255,.025)}.login-art h1{font-size:46px;line-height:1.08;max-width:650px;margin-top:140px}.login-art p{color:#cbd9ed;max-width:560px;font-size:17px}.login-form{display:grid;place-items:center;padding:50px}.login-box{width:min(410px,100%)}.login-box h2{font-size:29px;margin:0 0 8px}.login-box>p{color:var(--muted);margin-bottom:28px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f0f3f8;border-radius:11px;padding:4px;margin-bottom:22px}.tabs button{border:0;background:transparent;padding:10px;border-radius:8px;font-weight:700;color:var(--muted)}.tabs button.active{background:white;color:var(--blue);box-shadow:0 2px 8px rgba(0,0,0,.08)}.login-box .field{margin:14px 0}.login-box .btn{width:100%;margin-top:8px}.demo{margin-top:18px;border-radius:10px;padding:12px;background:#f7f9fc;color:var(--muted);font-size:12px}.toast{position:fixed;right:24px;bottom:24px;background:#14233b;color:#fff;border-radius:11px;padding:14px 18px;z-index:50;box-shadow:var(--shadow);max-width:370px}.outbox{position:fixed;right:0;top:0;bottom:0;width:420px;background:#fff;z-index:30;box-shadow:-15px 0 45px rgba(10,25,50,.15);padding:24px;overflow:auto}.mail{padding:15px;border:1px solid var(--line);border-radius:12px;margin-top:12px}.mail h4{margin:4px 0}.mail p{font-size:12px;color:var(--muted)}.mail a{color:var(--blue);font-weight:750}.upload{border:2px dashed #cad3e2;border-radius:10px;padding:15px;text-align:center;background:#fafcff}.progress{height:7px;background:#edf0f4;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan))}.empty{text-align:center;padding:52px;color:var(--muted)}
    @media(max-width:900px){.login{grid-template-columns:1fr}.login-art{display:none}.side{width:76px;padding:24px 12px}.side .brand div:last-child,.nav button span:last-child,.side-bottom .user-mini div:last-child{display:none}.main{margin-left:76px}.setup{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.span2{grid-column:auto}.outbox{width:min(100%,420px)}}
  </style>
</head>
<body>
<div id="app"></div>
<script>
const ACTIVE_DOCUMENTS=['RFC Tax Certificate','Proof of Address'];
const COUNTRIES={
  Brazil:{code:'BR',languages:['Português','English'],docs:ACTIVE_DOCUMENTS},
  Mexico:{code:'MX',languages:['Español','English'],docs:ACTIVE_DOCUMENTS},
  Colombia:{code:'CO',languages:['Español','English'],docs:ACTIVE_DOCUMENTS},
  Argentina:{code:'AR',languages:['Español','English'],docs:ACTIVE_DOCUMENTS},
  Chile:{code:'CL',languages:['Español','English'],docs:ACTIVE_DOCUMENTS},
  Peru:{code:'PE',languages:['Español','English'],docs:ACTIVE_DOCUMENTS}
};
const L={English:{welcome:'Vendor onboarding workspace',subtitle:'Create and track onboarding requests across LATAM.',country:'Operating country',language:'Communication language',onboard:'Onboard vendor'},Español:{welcome:'Espacio de incorporación de proveedores',subtitle:'Cree y siga solicitudes de incorporación en LATAM.',country:'País de operación',language:'Idioma de comunicación',onboard:'Incorporar proveedor'},Português:{welcome:'Espaço de integração de fornecedores',subtitle:'Crie e acompanhe solicitações de integração na América Latina.',country:'País de operação',language:'Idioma de comunicação',onboard:'Integrar fornecedor'}};
const API='http://127.0.0.1:3000/api';
const COUNTRY_BY_CODE=Object.fromEntries(Object.entries(COUNTRIES).map(([name,value])=>[value.code,name]));
const state={role:null,user:null,loginRole:'procurement',country:'',language:'',tickets:[],mails:[],apiReady:false};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const id=()=>`LAT-${new Date().getFullYear()}-${String(Math.floor(Math.random()*9000)+1000)}`;
async function api(path,options={}){const response=await fetch(`${API}${path}`,options);const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||`API request failed (${response.status})`);return data}
function mapTicket(t){const documents=t.documents.filter(d=>ACTIVE_DOCUMENTS.includes(d.name));const hasRejected=documents.some(d=>d.status==='INIT'&&d.rejectionReason);const ticketStatus=t.status==='LOCAL_PROCUREMENT_ACCEPTED'?'Approved':t.status==='DOCUMENTS_UPLOADED'?'Under review':hasRejected?'Changes requested':'Awaiting vendor';return{id:t.ticketNumber,name:t.vendorName,email:t.vendorEmail,address:t.address,country:COUNTRY_BY_CODE[t.countryCode]||t.countryCode,language:t.language,status:ticketStatus,created:t.createdAt,docs:documents.map(d=>({id:d.id,name:d.name,status:d.status==='LOCAL_PROCUREMENT_ACCEPTED'?'Approved':d.status==='DOCUMENTS_UPLOADED'?'Uploaded':d.rejectionReason?'Rejected':'Requested',version:d.version||0,note:d.rejectionReason||'',fileName:d.fileName||'',uploadId:d.latestUploadId}))}}
async function loadData(){const ticketPath=state.role==='vendor'&&state.user!=='vendor@example.com'?`/tickets?email=${encodeURIComponent(state.user)}`:'/tickets';const notificationPath=state.role==='vendor'&&state.user!=='vendor@example.com'?`/notifications?email=${encodeURIComponent(state.user)}`:'/notifications';const [tickets,notifications]=await Promise.all([api(ticketPath),api(notificationPath)]);state.tickets=tickets.map(mapTicket);state.mails=notifications.map(n=>({date:n.created_at,to:n.vendor_email||state.user,subject:n.subject,ticket:n.ticket_number,body:n.message,link:`#vendor-${encodeURIComponent(n.vendor_email||state.user)}`}));state.apiReady=true}
function toast(msg){const n=document.createElement('div');n.className='toast';n.textContent=msg;document.body.appendChild(n);setTimeout(()=>n.remove(),3200)}
function render(){document.getElementById('app').innerHTML=state.role?portal():login();bind()}
function login(){return `<div class="login"><section class="login-art"><div class="brand"><div class="brand-mark">C</div><div>Cognizant <small>LATAM vendor services</small></div></div><h1>Vendor onboarding, without the waiting.</h1><p>A single multilingual workspace for procurement teams and vendors across Latin America.</p></section><section class="login-form"><div class="login-box"><div class="eyebrow">Secure portal</div><h2>Welcome back</h2><p>Sign in to continue your onboarding workflow.</p><div class="tabs"><button data-role="procurement" class="${state.loginRole==='procurement'?'active':''}">Procurement team</button><button data-role="vendor" class="${state.loginRole==='vendor'?'active':''}">Vendor</button></div><form id="loginForm"><div class="field"><label>Email address</label><input id="email" type="email" required placeholder="name@company.com" value="${state.loginRole==='procurement'?'procurement@cognizant.com':'vendor@example.com'}"></div><div class="field"><label>Password</label><input id="password" type="password" required value="demo123"></div><button class="btn primary">Sign in securely</button></form><div class="demo">Demo access: choose either role and use any valid email with password <b>demo123</b>. Vendor email must match a ticket unless you use vendor@example.com to preview all vendor tickets.</div></div></section></div>`}
function sidebar(){return `<aside class="side"><div class="brand"><div class="brand-mark">C</div><div>Cognizant<small>Vendor onboarding</small></div></div><nav class="nav"><button class="active"><span class="icon">⌂</span><span>Dashboard</span></button><button id="outboxBtn"><span class="icon">✉</span><span>Mail outbox (${state.mails.length})</span></button></nav><div class="side-bottom"><div class="user-mini"><div class="avatar">${state.role==='procurement'?'PT':'V'}</div><div><b>${state.role==='procurement'?'Procurement Team':'Vendor Portal'}</b><small>${esc(state.user)}</small></div></div><button id="logout" class="btn ghost" style="width:100%;margin-top:14px;background:rgba(255,255,255,.07);border:0;color:white">Sign out</button></div></aside>`}
function portal(){const vendorTickets=state.role==='vendor'?state.tickets.filter(t=>t.email.toLowerCase()===state.user.toLowerCase()||state.user==='vendor@example.com'):state.tickets;return `<div class="shell">${sidebar()}<main class="main"><header class="top"><h1>${state.role==='procurement'?'Procurement control center':'My onboarding requests'}</h1><div class="top-actions"><span class="pill">● Secure session</span></div></header><div class="content">${state.role==='procurement'?procHome():vendorHome(vendorTickets)}</div></main></div>`}
function procHome(){const copy=L[state.language]||L.English;const approved=state.tickets.filter(t=>t.status==='Approved').length;const review=state.tickets.filter(t=>t.status==='Under review').length;return `<section class="hero"><div><div class="eyebrow">LATAM supplier operations</div><h2>${copy.welcome}</h2><p>${copy.subtitle}</p></div></section><div class="card setup"><div class="field"><label>${copy.country}</label><select id="country"><option value="">Select a country</option>${Object.keys(COUNTRIES).map(x=>`<option ${state.country===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>${copy.language}</label><select id="language" ${state.country?'':'disabled'}><option value="">Select a language</option>${(COUNTRIES[state.country]?.languages||[]).map(x=>`<option ${state.language===x?'selected':''}>${x}</option>`).join('')}</select></div><button id="newVendor" class="btn primary" ${state.country&&state.language?'':'disabled'}>＋ ${copy.onboard}</button></div><div class="grid"><div class="card metric"><div class="label">Total requests</div><strong>${state.tickets.length}</strong><small>Across ${new Set(state.tickets.map(t=>t.country)).size} LATAM markets</small></div><div class="card metric"><div class="label">Awaiting vendor</div><strong>${state.tickets.filter(t=>t.status==='Awaiting vendor').length}</strong><small>Document requests sent</small></div><div class="card metric"><div class="label">Under review</div><strong>${review}</strong><small>Ready for procurement</small></div><div class="card metric"><div class="label">Fully approved</div><strong>${approved}</strong><small>Onboarding complete</small></div></div>${ticketTable(state.tickets,true)}`}
function vendorHome(ts){return `<section class="hero"><div><div class="eyebrow">Vendor workspace</div><h2>Welcome to Cognizant onboarding</h2><p>Upload requested documents and follow your review status.</p></div></section>${ts.length?ticketTable(ts,false):'<div class="card empty"><h3>No onboarding requests found</h3><p>Sign in with the same email address used by the procurement team.</p></div>'}`}
function ticketTable(ts,proc){return `<div class="section-head"><h3>${proc?'Onboarding tickets':'Your requests'}</h3><span style="color:var(--muted)">${ts.length} request${ts.length===1?'':'s'}</span></div><div class="card table-wrap"><table class="table"><thead><tr><th>Ticket</th><th>Vendor</th><th>Country</th><th>Progress</th><th>Status</th><th></th></tr></thead><tbody>${ts.length?ts.map(t=>{const done=t.docs.filter(d=>d.status==='Approved').length;return `<tr><td class="ticket">${t.id}</td><td><b>${esc(t.name)}</b><br><small>${esc(t.email)}</small></td><td>${t.country}<br><small>${t.language}</small></td><td><b>${done}/${t.docs.length}</b><div class="progress"><span style="width:${done/t.docs.length*100}%"></span></div></td><td><span class="status ${statusClass(t.status)}">${t.status}</span></td><td><button class="mini openTicket" data-id="${t.id}">${proc?'Review':'Open request'} →</button></td></tr>`}).join(''):`<tr><td colspan="6" class="empty">No onboarding tickets yet.</td></tr>`}</tbody></table></div>`}
function statusClass(s){return s==='Approved'?'approved':s==='Under review'?'review':s==='Changes requested'?'rejected':'pending'}
function bind(){document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{state.loginRole=b.dataset.role;render()});document.getElementById('loginForm')?.addEventListener('submit',async e=>{e.preventDefault();if(document.getElementById('password').value!=='demo123')return toast('Use demo password: demo123');state.role=state.loginRole;state.user=document.getElementById('email').value;try{await loadData();render()}catch(error){state.role=null;render();toast(`Backend unavailable: ${error.message}`)}});document.getElementById('logout')?.addEventListener('click',()=>{state.role=null;state.tickets=[];state.mails=[];render()});document.getElementById('country')?.addEventListener('change',e=>{state.country=e.target.value;state.language='';render()});document.getElementById('language')?.addEventListener('change',e=>{state.language=e.target.value;render()});document.getElementById('newVendor')?.addEventListener('click',newVendorModal);document.querySelectorAll('.openTicket').forEach(b=>b.onclick=()=>openTicket(b.dataset.id));document.getElementById('outboxBtn')?.addEventListener('click',showOutbox)}
function modal(inner){const d=document.createElement('div');d.className='modal-backdrop';d.innerHTML=inner;document.body.appendChild(d);d.querySelectorAll('.close,[data-close]').forEach(x=>x.onclick=()=>d.remove());d.onclick=e=>{if(e.target===d)d.remove()};return d}
function newVendorModal(){const docs=COUNTRIES[state.country].docs;const m=modal(`<div class="modal"><div class="modal-head"><div><div class="eyebrow">New request · ${state.country}</div><h3>Vendor details</h3></div><button class="close">×</button></div><form id="vendorForm"><div class="modal-body"><div class="form-grid"><div class="field"><label>Vendor legal name</label><input name="name" required placeholder="Company legal name"></div><div class="field"><label>Vendor email</label><input name="email" type="email" required placeholder="onboarding@vendor.com"></div><div class="field span2"><label>Registered address</label><textarea name="address" required rows="3" placeholder="Street, city, state, postal code"></textarea></div></div><div class="section-head"><h3>Documents required in ${state.country}</h3><small>Select documents to request</small></div><div class="docs">${docs.map(d=>`<label class="doc-row"><input type="checkbox" name="doc" value="${esc(d)}"><div><p>${esc(d)}</p><small>Required for ${state.country} onboarding</small></div><span class="status pending">To request</span></label>`).join('')}</div></div><div class="modal-foot"><button type="button" data-close class="btn ghost">Cancel</button><button class="btn primary">Create ticket & send request</button></div></form></div>`);m.querySelector('#vendorForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),requested=f.getAll('doc');if(!requested.length)return toast('Select at least one document');const ticketNumber=id();const submit=e.target.querySelector('button[type="submit"],button.btn.primary');submit.disabled=true;try{await api('/tickets',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ticketNumber,vendorName:f.get('name'),vendorEmail:f.get('email'),address:f.get('address'),countryCode:COUNTRIES[state.country].code,language:state.language,documents:requested})});await loadData();m.remove();render();toast(`${ticketNumber} created in MySQL. Vendor notification generated.`)}catch(error){submit.disabled=false;toast(error.message)}}}
function showOutbox(){const m=modal(`<aside class="outbox"><div class="modal-head" style="padding:0 0 18px"><div><div class="eyebrow">MySQL notification service</div><h3>Notification outbox</h3></div><button class="close">×</button></div>${state.mails.length?state.mails.map(x=>`<article class="mail"><small>To: ${esc(x.to)}</small><h4>${esc(x.subject)}</h4><p>${esc(x.body)}</p><a href="${x.link}" class="vendorLink" data-email="${esc(x.to)}">Open vendor upload link →</a></article>`).join(''):'<div class="empty">No notifications yet.</div>'}</aside>`);m.querySelectorAll('.vendorLink').forEach(a=>a.onclick=async e=>{e.preventDefault();state.role='vendor';state.user=a.dataset.email;try{await loadData();m.remove();render();toast('Opened vendor access link')}catch(error){toast(error.message)}})}
function openTicket(ticketId){const t=state.tickets.find(x=>x.id===ticketId);if(!t)return;state.role==='vendor'?vendorTicket(t):procTicket(t)}
function vendorTicket(t){const rejected=t.docs.filter(d=>d.status==='Rejected');const visibleDocs=rejected.length?rejected:t.docs;const actionable=visibleDocs.filter(d=>d.status==='Requested'||d.status==='Rejected');const m=modal(`<div class="modal"><div class="modal-head"><div><div class="eyebrow">${t.id} · ${t.country}</div><h3>Upload requested documents</h3></div><button class="close">×</button></div><div class="modal-body"><p style="color:var(--muted)">${rejected.length?'Only documents that require correction are shown below.':'Files are stored by the local backend; metadata and review history are stored in MySQL.'}</p><div class="docs">${visibleDocs.map(d=>{const displayName=d.status==='Rejected'?`${d.name} — Rejected (v${d.version})`:d.name;return `<div class="doc-row"><span>${d.status==='Approved'?'✓':d.status==='Uploaded'?'↑':d.status==='Rejected'?'!':'○'}</span><div><p>${esc(displayName)}</p><small>${d.status}${d.note?' · Previous rejection: '+esc(d.note):''}${d.fileName?' · '+esc(d.fileName):''}</small></div><div>${d.status==='Requested'||d.status==='Rejected'?`<label class="mini">Choose file<input class="fileInput hidden" type="file" data-doc="${d.id}" accept=".pdf,.png,.jpg,.jpeg,.doc,.docx"></label>`:`<span class="status ${d.status==='Approved'?'approved':'review'}">${d.status}</span>`}</div></div>`}).join('')}</div></div><div class="modal-foot"><button data-close class="btn ghost">Close</button><button id="submitFiles" class="btn primary" ${actionable.length?'':'disabled'}>Submit uploaded documents</button></div></div>`);const chosen={};m.querySelectorAll('.fileInput').forEach(i=>i.onchange=()=>{if(i.files[0]){chosen[i.dataset.doc]=i.files[0];i.closest('label').firstChild.textContent=i.files[0].name}});m.querySelector('#submitFiles').onclick=async e=>{if(!Object.keys(chosen).length)return toast('Choose at least one file');e.target.disabled=true;try{for(const [docId,file] of Object.entries(chosen)){const body=new FormData();body.append('document',file);body.append('uploadedByEmail',state.user);await api(`/ticket-documents/${docId}/upload`,{method:'POST',body})}await loadData();m.remove();render();toast('Documents stored and submitted to procurement for review')}catch(error){e.target.disabled=false;toast(error.message)}}}
function procTicket(t){const m=modal(`<div class="modal"><div class="modal-head"><div><div class="eyebrow">${t.id} · ${t.country}</div><h3>${esc(t.name)}</h3></div><button class="close">×</button></div><div class="modal-body"><div class="form-grid"><div><small>VENDOR EMAIL</small><br><b>${esc(t.email)}</b></div><div><small>COMMUNICATION</small><br><b>${t.language}</b></div><div class="span2"><small>REGISTERED ADDRESS</small><br><b>${esc(t.address)}</b></div></div><div class="section-head"><h3>Document review</h3><span class="status ${statusClass(t.status)}">${t.status}</span></div><div class="docs">${t.docs.map(d=>`<div class="doc-row"><input class="reviewSelect" type="checkbox" data-doc="${d.id}" ${d.status==='Uploaded'?'':'disabled'}><div><p>${esc(d.name)}</p><small>${d.fileName?esc(d.fileName)+' · ':''}${d.status}${d.note?' · '+esc(d.note):''}</small><div class="field rejectionReason hidden" data-reason-for="${d.id}" style="margin-top:8px"><label>Reason for rejecting ${esc(d.name)}</label><textarea rows="2" placeholder="Explain what the vendor must correct"></textarea></div></div><div class="doc-actions">${d.uploadId?`<button class="mini viewDoc" data-doc="${d.id}">View</button>`:'<button class="mini" disabled>View</button>'}<button class="mini approve setDecision" data-doc="${d.id}" data-decision="APPROVED" ${d.status==='Uploaded'?'':'disabled'}>Approve</button><button class="mini reject setDecision" data-doc="${d.id}" data-decision="REJECTED" ${d.status==='Uploaded'?'':'disabled'}>Reject</button></div></div>`).join('')}</div></div><div class="modal-foot"><button data-close class="btn ghost">Close</button><button id="saveReview" class="btn primary">Submit review</button></div></div>`);const decisions={};m.querySelectorAll('.setDecision').forEach(b=>b.onclick=()=>{const cb=m.querySelector(`.reviewSelect[data-doc="${b.dataset.doc}"]`);if(!cb.checked)return toast('Select the document checkbox first');decisions[b.dataset.doc]=b.dataset.decision;b.parentElement.querySelectorAll('.setDecision').forEach(x=>x.style.background='');b.style.background=b.dataset.decision==='APPROVED'?'#e5f7f0':'#fff0f2';m.querySelector(`.rejectionReason[data-reason-for="${b.dataset.doc}"]`).classList.toggle('hidden',b.dataset.decision!=='REJECTED')});m.querySelectorAll('.viewDoc').forEach(b=>b.onclick=()=>{const d=t.docs.find(x=>String(x.id)===b.dataset.doc);if(d.uploadId)window.open(`${API}/uploads/${d.uploadId}`,'_blank')});m.querySelector('#saveReview').onclick=async e=>{const selected=[...m.querySelectorAll('.reviewSelect:checked')];if(!selected.length)return toast('Select at least one uploaded document');const payload=[];for(const cb of selected){const decision=decisions[cb.dataset.doc];if(!decision)return toast('Choose Approve or Reject for every selected document');const note=decision==='REJECTED'?m.querySelector(`.rejectionReason[data-reason-for="${cb.dataset.doc}"] textarea`).value.trim():'';if(decision==='REJECTED'&&!note)return toast('Add a separate reason for every rejected document');payload.push({documentId:Number(cb.dataset.doc),decision,note})}e.target.disabled=true;try{await api(`/tickets/${encodeURIComponent(t.id)}/review`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reviewedByEmail:state.user,decisions:payload})});await loadData();m.remove();render();toast(payload.some(x=>x.decision==='REJECTED')?'Re-upload notification sent to vendor':'Procurement review saved')}catch(error){e.target.disabled=false;toast(error.message)}}}
window.addEventListener('hashchange',async()=>{if(location.hash.startsWith('#vendor-')){state.role='vendor';state.user=decodeURIComponent(location.hash.slice(8));try{await loadData()}catch(error){toast(error.message)}render()}});async function boot(){if(location.hash.startsWith('#vendor-')){state.role='vendor';state.user=decodeURIComponent(location.hash.slice(8));try{await loadData()}catch(error){state.role=null;setTimeout(()=>toast(`Backend unavailable: ${error.message}`),0)}}render()}boot();
</script>
</body>
</html>
